name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A pull request from a branch of this repository shares the group of the
# branch push, so only one of the two runs is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Countdown logic (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, America/Mexico_City, America/New_York, Europe/Madrid, Australia/Sydney]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test 'tests/*.test.mjs'
        env:
          TZ: ${{ matrix.tz }}

  plasmoid:
    name: Plasma widget package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --yes gettext zip
      - name: Check that the translations compile
        run: scripts/build-translations.sh
      - name: Package
        run: scripts/package-plasmoid.sh
      - uses: actions/upload-artifact@v6
        with:
          name: plasmoid
          path: dist/*.plasmoid

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          # aqtinstall 3.3 cannot read the repository layout that Qt 6.11
          # introduced (miurahr/aqtinstall#959). Move to 6.11 once a newer
          # aqtinstall is released.
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Build
        shell: pwsh
        run: |
          cmake -S windows -B build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release 2>&1 | Tee-Object -Variable output
          if ($LASTEXITCODE) {
            # Repeat the errors as annotations so they show in the run summary.
            $output | Select-String -Pattern 'error [A-Z]+[0-9]+|CMake Error|: error:' |
              Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Deploy
        shell: pwsh
        run: |
          $dist = "dist/TimeUntil"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/Release/TimeUntil.exe $dist
          windeployqt --release --no-translations --no-opengl-sw --no-compiler-runtime `
            --qmldir windows/qml --qmldir plasma/contents/ui "$dist/TimeUntil.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Ship the C++ runtime next to the app, so no separate installer is needed.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $redist = (Get-Content "$vs/VC/Auxiliary/Build/Microsoft.VCRedistVersion.default.txt").Trim()
          Copy-Item "$vs/VC/Redist/MSVC/$redist/x64/Microsoft.VC*.CRT/*.dll" $dist
          Copy-Item LICENSE "$dist/LICENSE.txt"
          Copy-Item windows/installer/THIRD-PARTY-NOTICES.txt $dist
      - uses: actions/upload-artifact@v6
        with:
          name: TimeUntil-windows
          path: dist/TimeUntil
      - name: Build installer
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content windows/CMakeLists.txt -Raw), 'project\(TimeUntil VERSION ([0-9.]+)').Groups[1].Value
          $paths = "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe", "$env:ProgramFiles/Inno Setup*/ISCC.exe"
          $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = Get-ChildItem $paths | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=$version" windows/installer/timeuntil.iss
      - uses: actions/upload-artifact@v6
        with:
          name: TimeUntil-windows-installer
          path: dist/TimeUntil-*-setup.exe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, plasmoid, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Zip the portable Windows app
        run: cd artifacts && zip -qr "TimeUntil-${GITHUB_REF_NAME#v}-windows.zip" TimeUntil-windows
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/plasmoid/*.plasmoid
            artifacts/TimeUntil-windows-installer/*.exe
            artifacts/TimeUntil-*-windows.zip
